name: Build unsigned iPhone IPA

on:
  push:
    branches: [main]
    paths:
      - customization.patch
      - verify_ios_ipa.py
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-lite-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  BUILD_NAME: '1.5.2'
  UPSTREAM_REVISION: c034b98a536423fb23b35feda39dc63bf8043bb8

defaults:
  run:
    working-directory: source/apps/flutter
    shell: bash

jobs:
  checks:
    name: Offline analysis and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      build_date: ${{ steps.version.outputs.date }}
    steps:
      - name: Checkout customization
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout pinned public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: TG-Twilight/c001apk
          ref: c034b98a536423fb23b35feda39dc63bf8043bb8
          path: source
          persist-credentials: false
      - name: Apply customization
        working-directory: .
        run: |
          git -C source apply --check ../customization.patch
          git -C source apply ../customization.patch
          cp verify_ios_ipa.py source/apps/flutter/tool/verify_ios_ipa.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve build date (UTC+8)
        id: version
        run: dart tool/update_build_date.dart
      - run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run original offline regression tests
        run: flutter test --no-pub
      - name: Install preview fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Run customized edition tests
        env:
          UI_PREVIEW_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: flutter test --no-pub --dart-define=C001APK_LITE=true --dart-define=EXPORT_UI_PREVIEWS=true test/lite
      - name: Upload navigation previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-lite-navigation-previews
          path: source/apps/flutter/build/ui-previews/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Check dependency lockfile
        run: git diff --exit-code -- pubspec.lock

  ios:
    name: iPhone arm64 release (unsigned)
    needs: checks
    outputs:
      artifact_id: ${{ steps.ipa_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.ipa_artifact.outputs.artifact-digest }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ needs.checks.outputs.build_date }}.6
    steps:
      - name: Checkout customization
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout pinned public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: TG-Twilight/c001apk
          ref: c034b98a536423fb23b35feda39dc63bf8043bb8
          path: source
          persist-credentials: false
      - name: Apply customization
        working-directory: .
        run: |
          git -C source apply --check ../customization.patch
          git -C source apply ../customization.patch
          cp verify_ios_ipa.py source/apps/flutter/tool/verify_ios_ipa.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Synchronize build date
        run: dart tool/update_build_date.dart "${{ needs.checks.outputs.build_date }}"
      - run: flutter pub get --enforce-lockfile
      - name: Select an installed iOS 27 iPhone simulator
        run: |
          mkdir -p build
          xcodebuild -version
          xcrun simctl list devices available --json > build/simulators.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('build/simulators.json').read_text())
          candidates = [(runtime, d) for runtime, devices in data['devices'].items()
                        if '.iOS-27-' in runtime for d in devices
                        if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No installed iOS 27 iPhone simulator found')
          candidates.sort(key=lambda item: (not item[0].endswith('iOS-27-0'),
                                             item[1]['name'] != 'iPhone 16 Pro Max',
                                             item[0], item[1]['name']))
          runtime, device = candidates[0]
          Path('build/ios27-simulator.json').write_text(json.dumps(
              {'runtime': runtime, 'device': device}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIM_ID=' + device['udid'] + '\n')
          print(runtime, device['name'], device['udid'])
          PY
      - name: Build iOS 27 simulator gesture fixture
        run: |
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          flutter build ios --simulator --debug --target=tool/ios_gesture_smoke.dart --dart-define=C001APK_LITE=true
      - name: Run actual iOS 27 touch gestures on offline fixture
        run: |
          ruby tool/setup_ios_gesture_ui_tests.rb
          trap 'ruby tool/setup_ios_gesture_ui_tests.rb --clean' EXIT
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme GestureSmoke \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/ios-smoke-derived \
            -resultBundlePath build/ios27-smoke.xcresult \
            -parallel-testing-enabled NO -only-testing:GestureSmokeUITests \
            CODE_SIGNING_ALLOWED=NO FLUTTER_TARGET=tool/ios_gesture_smoke.dart \
            COMPILER_INDEX_STORE_ENABLE=NO | tee build/ios27-smoke.log
          ruby tool/setup_ios_gesture_ui_tests.rb --clean
          trap - EXIT
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d build/ios27-smoke.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ios27-smoke.xcresult --output-path build/ios27-smoke-attachments
          fi
      - name: Upload iOS 27 simulation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios27-gesture-simulation
          path: |
            source/apps/flutter/build/ios27-smoke-attachments/**
            source/apps/flutter/build/ios27-smoke.log
            source/apps/flutter/build/ios27-simulator.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build unsigned iPhone release
        # Flutter regenerates release-mode plugin registration here. Dependencies
        # were resolved with the lockfile enforced and must not change below.
        run: |
          flutter build ios --release --no-codesign --target=lib/main.dart --dart-define=C001APK_LITE=true --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          git diff --exit-code -- pubspec.lock
      - name: Package and verify IPA
        run: |
          distribution="$PWD/build/distribution"
          staging="$distribution/ios-staging"
          mkdir -p "$staging/Payload"
          ditto build/ios/iphoneos/Runner.app "$staging/Payload/Runner.app"
          archive="c001apk-lite-$BUILD_NAME+$BUILD_NUMBER-ios-arm64-unsigned.ipa"
          (cd "$staging" && ditto -c -k --keepParent Payload "../$archive")
          python3 tool/verify_ios_ipa.py "$distribution/$archive" \
            --expected-bundle-id com.randyliu2020.c001apk.lite \
            --expected-version "$BUILD_NAME" \
            --expected-build "$BUILD_NUMBER" \
            --source-revision "$GITHUB_SHA" \
            --upstream-revision "$UPSTREAM_REVISION" \
            --flutter-version "$FLUTTER_VERSION" \
            --xcode-version "$(xcodebuild -version | tr '\n' ' ')" \
            --report "$distribution/provenance.json"
          (cd "$distribution" && shasum -a 256 "$archive" > SHA256SUMS.txt)
          echo 'Built and verified an unsigned iPhone arm64 IPA from the public source implementation. Sign the complete app with your own certificate and provisioning profile before installing. Physical iPhone login and runtime acceptance have not been performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA and verification results
        id: ipa_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-lite-ios-arm64-unsigned
          path: |
            source/apps/flutter/build/distribution/*-ios-arm64-unsigned.ipa
            source/apps/flutter/build/distribution/SHA256SUMS.txt
            source/apps/flutter/build/distribution/provenance.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified IPA for direct download
    needs: [checks, ios]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        working-directory: .
        shell: bash
    outputs:
      download_url: ${{ steps.release.outputs.download_url }}
      release_url: ${{ steps.release.outputs.release_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BUILD_NUMBER: ${{ needs.checks.outputs.build_date }}.6
      ARTIFACT_ID: ${{ needs.ios.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.ios.outputs.artifact_digest }}
    steps:
      - name: Download and verify this run's release artifact
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" > artifact-info.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import zipfile
          
          artifact = json.loads(Path('artifact-info.json').read_text())
          artifact_id = int(os.environ['ARTIFACT_ID'])
          digest = os.environ['ARTIFACT_DIGEST'].removeprefix('sha256:')
          assert re.fullmatch(r'[0-9a-f]{64}', digest)
          assert artifact['id'] == artifact_id
          assert artifact['name'] == 'c001apk-lite-ios-arm64-unsigned'
          assert not artifact['expired']
          assert artifact['workflow_run']['id'] == int(os.environ['GITHUB_RUN_ID'])
          assert artifact['workflow_run']['head_sha'] == os.environ['GITHUB_SHA']
          assert artifact['digest'] == 'sha256:' + digest
          assert hashlib.sha256(Path('artifact.zip').read_bytes()).hexdigest() == digest
          
          build = os.environ['BUILD_NUMBER']
          assert re.fullmatch(r'\d{8}\.6', build)
          name = f"c001apk-lite-{os.environ['BUILD_NAME']}+{build}-ios-arm64-unsigned.ipa"
          expected = {name, 'SHA256SUMS.txt', 'provenance.json'}
          with zipfile.ZipFile('artifact.zip') as archive:
              assert archive.testzip() is None
              assert set(archive.namelist()) == expected
              assert len(archive.namelist()) == len(expected)
              for member in expected:
                  Path(member).write_bytes(archive.read(member))
          report = json.loads(Path('provenance.json').read_text())
          ipa_digest = hashlib.sha256(Path(name).read_bytes()).hexdigest()
          assert report['archive'] == name
          assert report['sha256'] == ipa_digest
          assert report['archive_bytes'] == Path(name).stat().st_size
          assert report['source_revision'] == os.environ['GITHUB_SHA']
          assert report['upstream_revision'] == os.environ['UPSTREAM_REVISION']
          assert report['version'] == os.environ['BUILD_NAME']
          assert report['build_number'] == build
          assert report['bundle_identifier'] == 'com.randyliu2020.c001apk.lite'
          assert report['platform'] == 'iPhoneOS'
          assert report['architectures'] == ['arm64']
          assert report['requires_user_signing'] is True
          assert report['embedded_provisioning_profile'] is False
          assert report['zip_crc_verified'] is True
          assert len(report['binaries']) == 19
          sums = Path('SHA256SUMS.txt').read_text().split()
          assert sums == [ipa_digest, name]
          with zipfile.ZipFile(name) as archive:
              assert archive.testzip() is None
              assert not any('.xctest/' in p or 'GestureSmoke' in p or p.endswith('/kernel_blob.bin')
                             for p in archive.namelist())
              info = plistlib.loads(archive.read('Payload/Runner.app/Info.plist'))
              assert info['CFBundleVersion'] == build
              assert info['CFBundleShortVersionString'] == os.environ['BUILD_NAME']
              assert info['CFBundleIdentifier'] == report['bundle_identifier']
              assert info.get('CADisableMinimumFrameDurationOnPhone') is True
              scenes = info['UIApplicationSceneManifest']['UISceneConfigurations']['UIWindowSceneSessionRoleApplication']
              assert any(s.get('UISceneDelegateClassName') == 'FlutterSceneDelegate' for s in scenes)
              for path, binary in report['binaries'].items():
                  assert hashlib.sha256(archive.read(path)).hexdigest() == binary['sha256']
                  assert binary['slices'] and all(
                      p['architecture'] == 'arm64' and p['platform'] == 'iPhoneOS'
                      for p in binary['slices'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'IPA_NAME={name}\n')
              env.write(f'RELEASE_TAG=ios-lite-r6-{build}\n')
          print('Verified r6 IPA from this run:', name, ipa_digest)
          
          PY
      - name: Publish verified release without replacing existing assets
        id: release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from urllib.parse import quote
          
          repo = os.environ['GH_REPO']
          commit = os.environ['GITHUB_SHA']
          tag = os.environ['RELEASE_TAG']
          ipa_name = os.environ['IPA_NAME']
          names = [ipa_name, 'SHA256SUMS.txt', 'provenance.json']
          expected = {
              name: {'size': Path(name).stat().st_size,
                     'digest': 'sha256:' + hashlib.sha256(Path(name).read_bytes()).hexdigest()}
              for name in names
          }
          
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          
          def api(path):
              return json.loads(gh('api', path))
          
          # A pre-existing tag must resolve to this exact source commit.
          reference = subprocess.run(
              ['gh', 'api', f'repos/{repo}/git/ref/tags/{quote(tag, safe="")}'],
              capture_output=True, text=True)
          if reference.returncode == 0:
              obj = json.loads(reference.stdout)['object']
              for _ in range(5):
                  if obj['type'] != 'tag':
                      break
                  obj = api(f'repos/{repo}/git/tags/{obj["sha"]}')['object']
              assert obj['type'] == 'commit' and obj['sha'] == commit, 'Tag points elsewhere'
          else:
              assert 'HTTP 404' in reference.stderr, reference.stderr
          
          # Listing also includes drafts for this token. Never treat an API failure as absence.
          pages = json.loads(gh('api', f'repos/{repo}/releases', '--paginate', '--slurp'))
          matches = [r for page in pages for r in page if r['tag_name'] == tag]
          assert len(matches) <= 1, 'Duplicate release tags'
          if matches:
              release = api(f'repos/{repo}/releases/{matches[0]["id"]}')
          else:
              notes = f"""c001apk iOS 精简版 r6（{os.environ['BUILD_NAME']} / {os.environ['BUILD_NUMBER']}）
          
          下载下方 .ipa 文件，在全能签中使用自己的有效证书签名安装。
          普通评论和用户名采用保守的轻量文字显示；复杂格式继续沿用原有渲染流程。
          保留链接、表情、图片清晰度及原有返回、缩放和切图手势。
          代码检查、回归和 iOS 27 模拟器触摸测试已完成，详细结果见本次构建记录。
          真机流畅度仍需要安装后的同场景记录验证，不承诺固定 120 帧。
          
          构建记录：https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}
          源码与复现：https://github.com/{repo}/tree/{commit}
          基于 TG-Twilight/c001apk 公开实现，源码与修改遵循 AGPLv3。
          IPA SHA256：{expected[ipa_name]['digest'].removeprefix('sha256:')}
          """
              Path('release-notes.txt').write_text(notes, encoding='utf-8')
              gh('release', 'create', tag, '--target', commit, '--draft',
                 '--title', f"c001apk iOS 精简版 r6 · {os.environ['BUILD_NUMBER']}",
                 '--notes-file', 'release-notes.txt')
              release_id = gh('release', 'view', tag, '--json', 'databaseId', '--jq', '.databaseId').strip()
              release = api(f'repos/{repo}/releases/{release_id}')
          
          def validate_existing(release, complete=False):
              assert release['tag_name'] == tag
              assert release['target_commitish'] == commit, 'Release source differs'
              assets = {a['name']: a for a in release['assets']}
              assert len(assets) == len(release['assets']), 'Duplicate asset names'
              assert set(assets) <= set(expected), 'Unexpected release assets'
              if complete or not release['draft']:
                  assert set(assets) == set(expected), 'Published release is incomplete'
              for name, asset in assets.items():
                  assert asset['state'] == 'uploaded', f'Incomplete asset: {name}'
                  assert asset['size'] == expected[name]['size'], f'Asset size differs: {name}'
                  assert asset['digest'] == expected[name]['digest'], f'Asset hash differs: {name}'
              return assets
          
          assets = validate_existing(release)
          missing = [name for name in names if name not in assets]
          if missing:
              assert release['draft'], 'Refusing to change an existing public release'
              # Upload only missing assets. No --clobber and no deletion of existing files.
              gh('release', 'upload', tag, *missing)
          release = api(f'repos/{repo}/releases/{release["id"]}')
          validate_existing(release, complete=True)
          if release['draft']:
              gh('release', 'edit', tag, '--draft=false')
          release = api(f'repos/{repo}/releases/{release["id"]}')
          assets = validate_existing(release, complete=True)
          assert release['draft'] is False
          direct_url = assets[ipa_name]['browser_download_url']
          receipt = {
              'release_url': release['html_url'], 'download_url': direct_url,
              'release_id': release['id'], 'release_tag': tag,
              'asset_id': assets[ipa_name]['id'], 'bytes': expected[ipa_name]['size'],
              'sha256': expected[ipa_name]['digest'].removeprefix('sha256:'),
              'source_revision': commit, 'build_number': os.environ['BUILD_NUMBER'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'artifact_digest': os.environ['ARTIFACT_DIGEST'],
              'draft': release['draft'],
          }
          Path('release-status.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('download_url=' + direct_url + '\n')
              output.write('release_url=' + release['html_url'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'\n[Download the verified r6 IPA]({direct_url})\n')
          print(json.dumps(receipt, indent=2))
          
          PY
      - name: Upload public download receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-lite-public-download
          path: release-status.json
          if-no-files-found: error
          retention-days: 14
