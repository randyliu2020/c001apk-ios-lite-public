name: Build display plugin
on:
  push:
    branches: [coolapk-display-16.7]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile and run UIKit regression checks
        run: python3 build_and_test.py
      - name: Upload checks and library
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coolapk-display-${{ github.sha }}
          path: |
            build/CoolapkDisplay.dylib
            build/*.json
            build/*.txt
          if-no-files-found: error
      - name: Publish the verified library only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "display-${GITHUB_SHA}" build/CoolapkDisplay.dylib build/build-manifest.json build/display-test-results.json --target "$GITHUB_SHA" --prerelease --title 'Coolapk display plugin — test build' --notes 'Display-only plugin compiled from the source in this commit. Synthetic UIKit tests passed. This release contains no Coolapk IPA. Not real-device performance or account validation.'
